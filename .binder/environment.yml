name: peecs
channels:
  - conda-forge
dependencies:
  - python=3.10
  # 科学计算栈
  - numpy>=1.26
  - scipy>=1.10
  - pandas>=2.0
  - matplotlib>=3.7

  # 机器学习 / 小工具
  - scikit-learn>=1.3
  - openpyxl>=3.1

  # 小部件 & Lab 支持
  - ipywidgets>=8
  - jupyterlab>=4
  - jupyterlab-widgets>=3      # Lab 前端的 widgets 支持
  - widgetsnbextension>=4      # 仅 classic Notebook 用，留着也无妨

  # 交互地图
  - ipyleaflet>=0.18

  - pip
  - pip:
      - opencv-python-headless>=4.9
